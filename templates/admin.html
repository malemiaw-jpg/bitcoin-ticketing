
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiser Dashboard | Bitcoin Ticketing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    {% include "header.html" %}

    <main>
        <section class="events-hero">
            <div class="container">
                <span class="section-label">ORGANISER AREA</span>
                <h1>Organiser Dashboard</h1>
                <p>Manage your events and ticket sales.</p>
                <a href="/create-event" class="nav-button">
                    Create New Event
                </a>
            </div>
        </section>

        <section class="events-section">
            <div class="container">
                <h2>Event Management</h2>

                <div class="events-grid">
                    <article class="event-card">
                        <div class="event-info">
                            <h3>Malawi Tech Summit</h3>
                            <p>December 15, 2026</p>
                            <p>Tickets available: 100</p>
                            <p>Ticket price: 10,000 sats</p>
                            <a href="/events/1" class="event-button">
                                View Event
                            </a>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Bitcoin Ticketing. Powered by Bitcoin Lightning.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
