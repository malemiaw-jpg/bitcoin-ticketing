
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | Bitcoin Ticketing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    {% include "header.html" %}

    <main>
        <section class="events-hero">
            <div class="container">
                <h1>Create an Event</h1>
                <p>Publish an event for people to discover and attend.</p>
            </div>
        </section>

        <section class="events-section">
            <div class="container">
                <div class="event-info">
                    <h2>Event Information</h2>

                    <form action="/create-event" method="POST">
                        <label for="title">Event Name</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter event name"
                            required
                        >

                        <br><br>

                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="Describe your event"
                        ></textarea>

                        <br><br>

                        <label for="venue">Venue</label>
                        <input
                            type="text"
                            id="venue"
                            name="venue"
                            placeholder="Enter event location"
                            required
                        >

                        <br><br>

                        <label for="event_date">Event Date</label>
                        <input
                            type="datetime-local"
                            id="event_date"
                            name="event_date"
                            required
                        >

                        <br><br>

                        <label for="price_sats">Ticket Price (sats)</label>
                        <input
                            type="number"
                            id="price_sats"
                            name="price_sats"
                            min="1"
                            placeholder="Example: 10000"
                            required
                        >

                        <br><br>

                        <label for="quantity">Number of Tickets</label>
                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="1"
                            placeholder="Example: 100"
                            required
                        >

                        <br><br>

                        <button type="submit" class="event-button">
                            Publish Event
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Bitcoin Ticketing. Powered by Bitcoin Lightning.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
