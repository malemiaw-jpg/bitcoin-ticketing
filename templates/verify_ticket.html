
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Ticket | Bitcoin Ticketing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    {% include "header.html" %}

    <main>
        <section class="events-hero">
            <div class="container">
                <h1>Ticket Verification</h1>
                <p>Check whether a ticket is valid before allowing entry.</p>
            </div>
        </section>

        <section class="events-section">
            <div class="container">
                <div class="event-info">
                    <h2>Enter Ticket Code</h2>

                    <form action="/verify-ticket" method="POST">
                        <label for="ticket_code">Ticket Verification Code</label>

                        <input
                            type="text"
                            id="ticket_code"
                            name="ticket_code"
                            placeholder="Enter ticket code"
                            required
                        >

                        <br><br>

                        <button type="submit" class="event-button">
                            Verify Ticket
                        </button>
                    </form>

                    <p id="verification-result">
                        Verification results will appear here.
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Bitcoin Ticketing. Powered by Bitcoin Lightning.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
